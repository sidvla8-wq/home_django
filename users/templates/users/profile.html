{% extends 'catalog/base.html' %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div class="auth-form">
  <h1>Мой профиль</h1>

  {% if user.avatar %}
    <img src="{{ user.avatar.url }}" alt="Аватар" width="150" style="border-radius: 50%; margin-bottom: 15px;">
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group">
      <label>{{ form.email.label_tag }}</label>
      {{ form.email }}
    </div>

    <div class="form-group">
      <label>{{ form.phone.label_tag }}</label>
      {{ form.phone }}
    </div>

    <div class="form-group">
      <label>{{ form.country.label_tag }}</label>
      {{ form.country }}
    </div>

    <div class="form-group">
      <label>{{ form.avatar.label_tag }}</label>
      {{ form.avatar }}
    </div>

    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'home' %}" class="btn btn-link">На главную</a>
  </form>
</div>
{% endblock %}
