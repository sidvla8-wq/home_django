{% extends "catalog/base.html" %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
<h1>Удалить продукт?</h1>
<p>Вы уверены, что хотите удалить «{{ product.name }}»? Это действие нельзя отменить.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Да, удалить</button>
  <a href="{% url 'product_detail' product.pk %}" class="btn">Отмена</a>
</form>
{% endblock %}
