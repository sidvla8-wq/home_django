{% extends "catalog/base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<h1>{{ product.name }}</h1>
{% if product.image %}
  <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width: 300px;">
{% endif %}
<p><strong>Цена:</strong> {{ product.price }} ₽</p>
<p><strong>Описание:</strong></p>
<p>{{ product.description|linebreaks }}</p>

<a href="{% url 'product_update' product.pk %}" class="btn btn-secondary">Редактировать</a>
<a href="{% url 'product_delete' product.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'product_list' %}" class="btn">Назад к списку</a>
{% endblock %}
