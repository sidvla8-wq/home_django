{% extends 'catalog/base.html' %}

{% block title %}Сообщение — создание/редактирование{% endblock %}

{% block content %}
<h1>Сообщение</h1>
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      {{ field.label_tag }}
      {{ field }}
      {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Сохранить</button>
  <a href="{% url 'mailings:message_list' %}" class="btn btn-link">Отмена</a>
</form>
{% endblock %}
