{% extends 'catalog/base.html' %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}
<h1>Удалить получателя?</h1>
<p>Вы уверены, что хотите удалить «{{ recipient.full_name }}» ({{ recipient.email }})?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Да, удалить</button>
  <a href="{% url 'mailings:recipient_list' %}" class="btn btn-link">Отмена</a>
</form>
{% endblock %}
