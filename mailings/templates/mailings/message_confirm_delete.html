{% extends 'catalog/base.html' %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<h1>Удалить сообщение?</h1>
<p>Вы уверены, что хотите удалить «{{ message.subject }}»?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Да, удалить</button>
  <a href="{% url 'mailings:message_list' %}" class="btn btn-link">Отмена</a>
</form>
{% endblock %}
