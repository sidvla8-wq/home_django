{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<h1>Удалить статью?</h1>
<p>Вы уверены, что хотите удалить «{{ object.title }}»?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Да, удалить</button>
  <a href="{% url 'blog:article_list' %}">Отмена</a>
</form>
{% endblock %}
